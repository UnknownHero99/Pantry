		<path d="M12 47.5h40" stroke="#f1ede6" stroke-width="3" stroke-linecap="round" />
		<path d="M10 36h44" stroke="#ee6a52" stroke-width="2.5" stroke-linecap="round" />
	</g>
</svg>
