# A buzzer for pantry-feedback.yaml's scan sounds: a buzzer module on the Sunton, or
# the buzzer on the scanner carrier or the mainboard. Included with its pin as vars:
#
#   buzzer: !include
#     file: pantry-buzzer.yaml
#     vars: { buzzer_pin: GPIO18, buzzer_inverted: "true" }
#
# buzzer_inverted: "true" for a buzzer module whose transistor switches on when its
# input is low (the common 3-pin ones with an 8550 / 9012 PNP), "false" otherwise.

output:
  - platform: ledc
    id: buzzer_out
    pin: ${buzzer_pin}
    inverted: ${buzzer_inverted}

rtttl:
  output: buzzer_out
  gain: 60%
