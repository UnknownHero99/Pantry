# The scanner carrier board (hardware/scanner-carrier): buzzer, status LED and
# presence radar for the wall scanner. To use it, uncomment it in
# pantry-scanner.yaml's packages:
#
#   packages:
#     carrier: !include pantry-carrier.yaml
#     ui: !include pantry-ui.yaml
#
# Pins (Sunton connectors → carrier):
#   P4: IO18 buzzer (PWM), IO17 WS2812B status LED
#   P2: IO12 radar presence (OUT), IO13 ← radar TX, IO11 → radar RX
# IO11-13 are the Sunton's SD card pins: leave the SD slot empty.

packages:
  feedback: !include
    file: pantry-feedback.yaml
    vars: { buzzer_pin: GPIO18, led_pin: GPIO17, led_chipset: WS2812, presence_pin: GPIO12 }

# The radar's UART lets Home Assistant tune its range (the ld2410 component's
# gate settings); waking only needs OUT.
uart:
  - id: radar_uart
    tx_pin: GPIO11
    rx_pin: GPIO13
    baud_rate: 256000

ld2410:
  uart_id: radar_uart
