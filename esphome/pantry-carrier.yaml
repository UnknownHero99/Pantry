# The scanner carrier board (hardware/scanner-carrier): buzzer, status LED and
# presence radar for the wall scanner. To use it, uncomment it in
# pantry-scanner.yaml's packages:
#
#   packages:
#     carrier: !include pantry-carrier.yaml
#     ui: !include pantry-ui.yaml
#
# Pins (Sunton connectors → carrier):
#   P4: IO18 buzzer (PWM), IO17 WS2812B status LED
#   P2: IO12 radar presence (OUT), IO13 ← radar TX, IO11 → radar RX
# IO11-13 are the Sunton's SD card pins: leave the SD slot empty.

output:
  - platform: ledc
    id: buzzer_out
    pin: GPIO18

rtttl:
  output: buzzer_out
  gain: 60%

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    pin: GPIO17
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

# HLK-LD2410C. Its OUT pin is enough to wake the screen; the UART lets Home
# Assistant tune its range (the ld2410 component's gate settings).
uart:
  - id: radar_uart
    tx_pin: GPIO11
    rx_pin: GPIO13
    baud_rate: 256000

ld2410:
  uart_id: radar_uart

binary_sensor:
  - platform: gpio
    id: presence
    name: Presence
    pin: GPIO12
    device_class: occupancy
    on_press:
      - script.execute: wake

script:
  # What a scan sounds and looks like. Called by the UI with the result:
  # out, in, undo, lookup, unknown, empty, box, error, offline.
  - id: !extend feedback   # the UI's empty hook (pantry-ui.yaml)
    mode: restart
    then:
      - lambda: |-
          // r, g, b; amber while a new barcode is looked up or needs naming, red when it went wrong
          float c[3] = {1, 0, 0};
          if (kind == "out") { c[0] = 0; c[1] = 1; c[2] = 0.2; }
          else if (kind == "in" || kind == "box") { c[0] = 0; c[1] = 0.45; c[2] = 1; }
          else if (kind == "undo") { c[0] = 0.6; c[1] = 0.6; c[2] = 0.6; }
          else if (kind == "lookup" || kind == "unknown") { c[0] = 1; c[1] = 0.5; c[2] = 0; }
          auto call = id(status_led).turn_on();
          call.set_brightness(0.6);
          call.set_rgb(c[0], c[1], c[2]);
          call.perform();
      - if:
          condition:
            lambda: 'return kind != "lookup";'   # the lookup's real answer beeps a moment later
          then:
            - rtttl.play:
                rtttl: !lambda |-
                  if (kind == "out" || kind == "box") return std::string("out:d=32,o=6,b=180:e7");
                  if (kind == "in") return std::string("in:d=32,o=6,b=180:c7,e7");
                  if (kind == "undo") return std::string("undo:d=32,o=6,b=180:e7,c7");
                  if (kind == "unknown") return std::string("new:d=16,o=6,b=160:a,e");
                  return std::string("err:d=8,o=5,b=140:c,p,c");
      - delay: !lambda 'return kind == "out" || kind == "in" || kind == "undo" || kind == "box" ? 1500 : 4000;'
      - light.turn_off: status_led
