# The scanner carrier board (hardware/scanner-carrier): buzzer and status LED
# for the wall scanner on the Sunton. To use it, swap it for the feedback package
# in pantry-sunton.yaml:
#
#   packages:
#     carrier: !include pantry-carrier.yaml
#     ui: !include pantry-ui.yaml
#
# Pins (Sunton connector P4 → carrier): IO18 buzzer (PWM), IO17 WS2812B status LED.

packages:
  feedback: !include
    file: pantry-feedback.yaml
    vars: { buzzer_pin: GPIO18, buzzer_inverted: "false", led_pin: GPIO17, led_chipset: WS2812 }
