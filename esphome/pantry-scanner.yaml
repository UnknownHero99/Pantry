# Pantry wall scanner
#   Sunton ESP32-8048S043C (ESP32-S3, 4.3" 800x480, GT911 capacitive touch)
#   + GM65 / GM861 barcode module on the board's 4-pin UART connector.
#
# Wiring (UART JST 1.25 connector on the board → scanner TTL side):
#   5V → VCC   GND → GND   TX(GPIO43) → scanner RX   RX(GPIO44) → scanner TX
# GPIO43/44 is also the USB serial, so unplug the scanner for the very first
# USB flash; after that, update over Wi-Fi (OTA).
#
# Scanner setup (scan the config barcodes in the GM65 manual once):
#   UART output, 9600 baud, continuous/induction mode, add CR suffix.
#
# This file is the hardware; the screens live in pantry-ui.yaml (+ pantry_ui.h).
# No hardware yet? pantry-sim.yaml runs the same screens in a desktop window.

substitutions:
  name: pantry-scanner
  server: http://192.168.10.10:5190   # pantry app, reachable from this VLAN
  location: Pantry                     # where this unit hangs; used for products with no usual place yet

esphome:
  name: ${name}
  friendly_name: Pantry scanner

# The screens and everything they do; shared with pantry-sim.yaml.
packages:
  ui: !include pantry-ui.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# UART0 belongs to the scanner; logs are still available over Wi-Fi.
logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

# OTA uses the API encryption key.
ota:
  - platform: esphome

# The clock comes from Home Assistant, so the IoT VLAN needs no internet.
time:
  - platform: homeassistant
    id: ha_time

# ── hardware ────────────────────────────────────────────────────────────

uart:
  id: scanner_uart
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 9600
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\r"
      timeout: 100ms   # also works if the CR suffix isn't enabled
    sequence:
      - lambda: |-
          std::string code;
          for (auto b : bytes) if (b > 32 && b < 127) code += (char) b;
          if (!code.empty()) id(handle_scan)->execute(code);

output:
  - platform: ledc
    pin: GPIO2
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

# GPIO19/20 would clash with native USB-JTAG, but this board's USB goes
# through a CH340 on UART0 instead, so ESPHome's warning about them is moot.
i2c:
  sda: GPIO19
  scl: GPIO20

touchscreen:
  - platform: gt911
    id: touch
    display: main_display
    on_touch:
      - script.execute: wake

display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    pclk_frequency: 16MHz
    pclk_inverted: true
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
