# Pantry wall scanner
#   Guition JC4880P443C (ESP32-P4, with an ESP32-C6 for Wi-Fi; 4.3" 480x800 IPS
#   turned to landscape, GT911 capacitive touch)
#   + a GROW GM67 barcode scanner, a small speaker and a WS2812 LED module on the
#     board's own connectors. No custom board needed.
#
# Wiring (board connector → module):
#   CN2 "UART0", 1.25 mm 4-pin (VIN, TX GPIO37, RX GPIO38, GND)
#                         → GM67 UART (5V, TX, RX, GND): same pin order, so cross
#                           TX and RX (CN2 pin 2 → GM67 pin 3, pin 3 → pin 2)
#   Speaker socket, 1.25 mm 2-pin  → an 8 ohm 1-2 W speaker (the board's ES8311 audio
#                                    chip and amplifier drive it)
#   JP1, the 2x13 2.54 mm header:
#     pins 2, 4, 6:  3.3V, GND, GPIO33 → LED: VCC, GND, DIN
#     pins 16, 14:   3.3V, GND         → a SparkFun scanner's 3V3 instead (it runs on 3.3 V)
# Flash and logs go over the USB-C marked full speed (USB Serial/JTAG), so UART0
# is the scanner's and the scanner can stay plugged in.
#
# Scanner setup (scan the config barcodes in its manual once):
#   UART output, 9600 baud, continuous/induction mode, add CR suffix; silent mode,
#   since the speaker does the beeping.
#
# This file is the hardware; the screens live in pantry-ui.yaml (+ pantry_ui.h).
# No hardware yet? pantry-sim.yaml runs the same screens in a desktop window.
# On the Sunton ESP32-8048S043C instead: pantry-sunton.yaml.

substitutions:
  name: pantry-scanner
  server: http://192.168.10.10:5190   # pantry app, reachable from this VLAN
  location: Pantry                     # where this unit hangs; used for products with no usual place yet
  scanner_baud: "9600"                 # GM67 / GM65 default; set a SparkFun DE2120 to 9600 too, or change this
  # Early ESP32-P4 chips (revision v1.x) need a build for them. The first USB flash
  # prints "Chip is ESP32-P4 (revision v1.3)" or similar: below v3.0, set this to "true".
  engineering_sample: "false"
  # The panel is portrait; this turns it (and touch) to landscape. Upside down? 270.
  rotation: "90"

esphome:
  name: ${name}
  friendly_name: Pantry scanner

# The status LED and scan sounds, and the screens (shared with pantry-sim.yaml).
# No LED or speaker? Drop feedback, and the speaker section below.
packages:
  feedback: !include
    file: pantry-feedback.yaml
    vars: { led_pin: GPIO33, led_chipset: WS2812 }
  ui: !include pantry-ui.yaml

# Added to the lvgl: block in pantry-ui.yaml.
lvgl:
  rotation: ${rotation}

esp32:
  variant: esp32p4
  engineering_sample: ${engineering_sample}
  cpu_frequency: 360MHz   # 400 MHz is still experimental on the P4 in ESPHome
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: hex
  speed: 200MHz

# UART0 belongs to the scanner; logs go to the USB-C (and over Wi-Fi).
logger:
  hardware_uart: USB_SERIAL_JTAG

# The P4 has no radio: Wi-Fi is the ESP32-C6 next to it, over SDIO.
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

# OTA uses the API encryption key.
ota:
  - platform: esphome

# The C6 ships with an older ESP-Hosted firmware than ESPHome expects, which
# can drop Wi-Fi now and then. This offers ESPHome's build of it as an update
# in Home Assistant (Settings → Devices → Pantry scanner): install it once.
update:
  - platform: esp32_hosted
    name: Wi-Fi co-processor
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json

# The clock comes from Home Assistant, so the IoT VLAN needs no internet.
time:
  - platform: homeassistant
    id: ha_time

# ── hardware ────────────────────────────────────────────────────────────

# GPIO37/38 are strapping pins, but they are the board's own UART0 connector.
uart:
  - id: scanner_uart
    tx_pin: { number: GPIO37, ignore_strapping_warning: true }
    rx_pin: { number: GPIO38, ignore_strapping_warning: true }
    baud_rate: ${scanner_baud}
    debug:
      direction: RX
      dummy_receiver: true
      after:
        delimiter: "\r"
        timeout: 100ms   # also works if the CR suffix isn't enabled
      sequence:
        - lambda: |-
            std::string code;
            for (auto b : bytes) if (b > 32 && b < 127) code += (char) b;
            if (!code.empty()) id(handle_scan)->execute(code);

# The DSI PHY's 2.5 V supply.
esp_ldo:
  - channel: 3
    voltage: 2.5V

output:
  - platform: ledc
    pin: GPIO23
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

# Touch, the audio codec and the camera share this bus.
i2c:
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz

# ── speaker: the board's ES8311 audio chip and amplifier ────────────────
# pantry-feedback.yaml's scan sounds play here.

i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO13
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO10

audio_dac:
  - platform: es8311
    id: codec

speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: codec

# The amplifier's enable pin; on all the time, it only draws a little while silent.
switch:
  - platform: gpio
    id: speaker_amp
    pin: GPIO11
    restore_mode: ALWAYS_ON
    internal: true

rtttl:
  speaker: speaker_out
  gain: 60%

# Polled: sources disagree on the touch controller's reset and interrupt pins
# (GPIO22/21 in the schematic notes, GPIO3 in a working config), so neither is used.
touchscreen:
  - platform: gt911
    id: touch
    display: main_display
    update_interval: 50ms
    on_touch:
      - script.execute: wake

display:
  - platform: mipi_dsi
    id: main_display
    model: JC4880P443
    byte_order: little_endian
    update_interval: never
    auto_clear_enabled: false
