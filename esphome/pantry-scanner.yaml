# Pantry wall scanner
#   Sunton ESP32-8048S043C (ESP32-S3, 4.3" 800x480, GT911 capacitive touch)
#   + GM65 / GM861 barcode module on the board's 4-pin UART connector.
#
# Wiring (UART JST 1.25 connector on the board → scanner TTL side):
#   5V → VCC   GND → GND   TX(GPIO43) → scanner RX   RX(GPIO44) → scanner TX
# GPIO43/44 is also the USB serial, so unplug the scanner for the very first
# USB flash; after that, update over Wi-Fi (OTA).
#
# Scanner setup (scan the config barcodes in the GM65 manual once):
#   UART output, 9600 baud, continuous/induction mode, add CR suffix.
#
# Screen layout (v2 design): a status bar on top, a stage in the middle that
# swaps cards per state, and a fixed bottom bar with TAKE OUT | PUT AWAY and
# UNDO. pantry_ui.h holds the data and text helpers the lambdas use.
#
# http_request blocks the main loop (and so the screen) while it waits, so
# nothing here waits on the internet: a new barcode is looked up by the
# server in the background, and this unit polls for the result.

substitutions:
  name: pantry-scanner
  server: http://192.168.10.10:5190   # pantry app, reachable from this VLAN
  location: Pantry                     # where this unit hangs; used for products with no usual place yet

esphome:
  name: ${name}
  friendly_name: Pantry scanner
  includes:
    - pantry_ui.h
  on_boot:
    priority: -100
    then:
      - script.execute: paint_mode
      - script.execute: show_idle
      - script.execute: fetch_summary

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# UART0 belongs to the scanner; logs are still available over Wi-Fi.
logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

# OTA uses the API encryption key.
ota:
  - platform: esphome

http_request:
  verify_ssl: false
  # Short: every request freezes the screen until it returns. The server
  # answers scans straight away and does slow lookups in the background.
  timeout: 4s

json:

# The clock comes from Home Assistant, so the IoT VLAN needs no internet.
time:
  - platform: homeassistant
    id: ha_time

# ── hardware ────────────────────────────────────────────────────────────

uart:
  id: scanner_uart
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 9600
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\r"
      timeout: 100ms   # also works if the CR suffix isn't enabled
    sequence:
      - lambda: |-
          std::string code;
          for (auto b : bytes) if (b > 32 && b < 127) code += (char) b;
          if (!code.empty()) id(handle_scan)->execute(code);

output:
  - platform: ledc
    pin: GPIO2
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

# GPIO19/20 would clash with native USB-JTAG, but this board's USB goes
# through a CH340 on UART0 instead, so ESPHome's warning about them is moot.
i2c:
  sda: GPIO19
  scl: GPIO20

touchscreen:
  - platform: gt911
    id: touch
    display: main_display
    on_touch:
      - script.execute: wake

display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    pclk_frequency: 16MHz
    pclk_inverted: true
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]

# ── state ───────────────────────────────────────────────────────────────
# Scan data, the put-away trip and the offline queue live in pantry_ui.h.

globals:
  - { id: mode_in, type: bool, initial_value: "false" }
  - { id: pa_left, type: int, initial_value: "0" }        # seconds until put-away falls back to take-out
  - { id: online, type: bool, initial_value: "true" }
  - { id: asleep, type: bool, initial_value: "false" }
  - { id: undo_event, type: int, initial_value: "0" }     # what UNDO and −/+ act on
  - { id: fix_event, type: int, initial_value: "0" }      # the nothing-in-stock scan "fix count" corrects
  - { id: undo_open, type: bool, initial_value: "false" } # the UNDO list is showing
  - { id: last_try, type: std::string, initial_value: '""' }
  # Set by render_reply. Kept here because ESPHome emits some actions above the
  # pantry_ui.h include, where pantry:: isn't visible yet.
  - { id: photo_url, type: std::string, initial_value: '""' }

# ── look ────────────────────────────────────────────────────────────────

# Latin Core covers č š ž ć đ — Open Food Facts names come back in Slovenian.
font:
  - { file: "gfonts://Roboto", id: f15, size: 15, bpp: 4, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto@700", id: f15b, size: 15, bpp: 4, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto@700", id: f17b, size: 17, bpp: 4, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto", id: f18, size: 18, bpp: 4, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto", id: f20, size: 20, bpp: 4, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto@700", id: f22b, size: 22, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: ["−"], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto@700", id: f24b, size: 24, bpp: 4, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto@700", id: f30b, size: 30, bpp: 4, glyphsets: [GF_Latin_Core], glyphs: ["−"], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto@700", id: f36b, size: 36, bpp: 4, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto@700", id: f44b, size: 44, bpp: 4, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true }
  - { file: "gfonts://Roboto@700", id: f72b, size: 72, bpp: 4, glyphs: "0123456789" }
  - { file: "gfonts://Roboto@300", id: f140, size: 140, bpp: 4, glyphs: "0123456789:" }
  # Material Design Icons: arrow-down, arrow-up, arrow-right, undo, check-bold,
  # barcode-scan, help-circle-outline, alert, wifi-off, cart-outline,
  # clock-outline, tag-outline, close
  - file: &mdi "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: i22
    size: 22
    bpp: 4
    glyphs: &icons ["\U000F0045", "\U000F005D", "\U000F0054", "\U000F054C", "\U000F0E1E", "\U000F0072",
                    "\U000F0625", "\U000F0026", "\U000F05AA", "\U000F0111", "\U000F0150", "\U000F04FC",
                    "\U000F0156"]
  - { file: *mdi, id: i28, size: 28, bpp: 4, glyphs: *icons }
  - { file: *mdi, id: i64, size: 64, bpp: 4, glyphs: *icons }

image:
  - platform: online_image
    id: product_img
    url: ${server}/img/0.jpg   # replaced at runtime per scan
    format: JPEG                # the app stores every product photo as JPEG
    type: RGB565
    resize: 168x168
    update_interval: never
    on_download_finished:
      - lvgl.image.update: { id: img_product, src: product_img }
      - lvgl.widget.show: img_product
      - lvgl.widget.hide: media_icon
    on_error:
      - lvgl.widget.hide: img_product
      - lvgl.widget.show: media_icon

lvgl:
  displays: [main_display]
  touchscreens: [touch]
  buffer_size: 25%
  default_font: f20
  on_idle:
    timeout: 5min
    then:
      - script.execute: go_to_sleep
  theme:
    # Plain containers: no default border, padding, radius or background.
    obj:
      border_width: 0
      pad_all: 0
      radius: 0
      bg_opa: TRANSP
    button:
      shadow_width: 0
      border_width: 0
  pages:
    - id: main_page
      bg_color: 0x0E1116
      text_color: 0xF1F3F7
      scrollable: false
      widgets:
        # ── status bar: clock, date, location / offline ──────────────────
        - obj:
            id: sb_normal
            x: 0
            y: 0
            width: 800
            height: 56
            pad_left: 20
            pad_right: 20
            scrollable: false
            layout: { type: flex, flex_flow: row, flex_align_cross: center, pad_column: 14 }
            widgets:
              - label: { id: lbl_clock, text: "--:--", text_font: f30b }
              - label: { id: lbl_date, text: "", text_font: f20, text_color: 0x8C95A5 }
              - obj: { flex_grow: 1, height: 1 }
              - obj: { id: status_dot, width: 10, height: 10, radius: 5, bg_opa: COVER, bg_color: 0x2FBF71 }
              - label: { id: lbl_status, text: "${location}", text_font: f18, text_color: 0x8C95A5 }

        # ── status bar in put-away mode: blue band + drain bar ───────────
        - obj:
            id: sb_putaway
            x: 0
            y: 0
            width: 800
            height: 56
            pad_left: 20
            pad_right: 20
            bg_opa: COVER
            bg_color: 0x1F6FD1
            text_color: 0xFFFFFF
            hidden: true
            scrollable: false
            layout: { type: flex, flex_flow: row, flex_align_cross: center, pad_column: 12 }
            widgets:
              - label: { text: "\U000F005D", text_font: i28 }
              - label: { text: "PUTTING AWAY", text_font: f22b, text_letter_space: 1 }
              - label: { id: lbl_pa_count, text: "", text_font: f20, text_color: 0xD6E6FF }
              - obj: { flex_grow: 1, height: 1 }
              - label: { id: lbl_pa_timer, text: "", text_font: f18, text_color: 0xD6E6FF, recolor: true }
              - bar:
                  id: bar_pa
                  floating: true
                  align: BOTTOM_LEFT
                  x: -20
                  width: 800
                  height: 4
                  min_value: 0
                  max_value: 120
                  value: 120
                  radius: 0
                  bg_opa: COVER
                  bg_color: 0x174F96
                  anim_duration: 1s
                  indicator:
                    radius: 0
                    bg_color: 0xFFFFFF

        # ── stage: one card (+ banner) on the left, a side panel on the right
        - obj:
            id: stage
            x: 20
            y: 60
            width: 760
            height: 316
            scrollable: false
            layout: { type: flex, flex_flow: row, pad_column: 14 }
            widgets:
              - obj:
                  id: card_col
                  flex_grow: 1
                  height: 100%
                  scrollable: false
                  layout: { type: flex, flex_flow: column, pad_row: 12 }
                  widgets:
                    # Home: what to do next
                    - obj:
                        id: home_card
                        width: 100%
                        flex_grow: 1
                        bg_opa: COVER
                        bg_color: 0x171B22
                        radius: 20
                        pad_left: 30
                        pad_right: 30
                        scrollable: false
                        layout: { type: flex, flex_flow: column, flex_align_main: center, pad_row: 14 }
                        widgets:
                          - label: { id: home_icon, text: "\U000F0072", text_font: i64 }
                          - label: { id: home_title, text: "Scan to take out", text_font: f44b, width: 100%, long_mode: WRAP }
                          - label:
                              id: home_hint
                              text: "Unpacking shopping? Tap #6FB0FF Put away# first."
                              recolor: true
                              width: 100%
                              long_mode: WRAP
                              text_color: 0xA3ACBB

                    # Result of a scan: product, home-made package, nothing in stock, error
                    - obj:
                        id: res_card
                        width: 100%
                        flex_grow: 1
                        hidden: true
                        bg_opa: COVER
                        bg_color: 0x171B22
                        radius: 20
                        border_width: 3
                        border_color: 0x2FBF71
                        pad_all: 20
                        scrollable: false
                        layout: { type: flex, flex_flow: row, flex_align_cross: center, pad_column: 22 }
                        widgets:
                          - obj:
                              id: res_media
                              width: 168
                              height: 168
                              radius: 16
                              clip_corner: true
                              bg_opa: COVER
                              bg_color: 0x222936
                              scrollable: false
                              widgets:
                                - label: { id: media_icon, align: CENTER, text: "\U000F0072", text_font: i64, text_color: 0x5C6575 }
                                - image: { id: img_product, src: product_img, align: CENTER, hidden: true }
                                - label: { id: lbl_pkg_code, align: BOTTOM_MID, y: -10, text: "", text_font: f15b, text_color: 0x8C95A5 }
                          - obj:
                              id: res_info
                              flex_grow: 1
                              height: 100%
                              scrollable: false
                              layout: { type: flex, flex_flow: column, pad_row: 6 }
                              widgets:
                                - obj:
                                    width: SIZE_CONTENT
                                    height: SIZE_CONTENT
                                    layout: { type: flex, flex_flow: row, flex_align_cross: center, pad_column: 6 }
                                    widgets:
                                      - label: { id: chip_icon, text: "\U000F0E1E", text_font: i22 }
                                      - label: { id: chip_text, text: "", text_font: f17b, text_letter_space: 1 }
                                - label: { id: res_name, text: "", text_font: f36b, width: 100%, max_height: 84, long_mode: WRAP }
                                - label: { id: res_meta, text: "", width: 100%, long_mode: DOT, text_color: 0xA3ACBB }
                                - obj:
                                    id: pkg_tiles
                                    width: 100%
                                    height: SIZE_CONTENT
                                    hidden: true
                                    layout: { type: flex, flex_flow: row, pad_column: 10 }
                                    widgets:
                                      - obj:
                                          flex_grow: 1
                                          height: SIZE_CONTENT
                                          bg_opa: COVER
                                          bg_color: 0x202631
                                          radius: 12
                                          pad_all: 8
                                          pad_left: 14
                                          layout: { type: flex, flex_flow: column, pad_row: 2 }
                                          widgets:
                                            - label: { text: "PACKED", text_font: f15b, text_letter_space: 1, text_color: 0x8C95A5 }
                                            - label: { id: lbl_packed, text: "" }
                                      - obj:
                                          flex_grow: 1
                                          height: SIZE_CONTENT
                                          bg_opa: COVER
                                          bg_color: 0x202631
                                          radius: 12
                                          pad_all: 8
                                          pad_left: 14
                                          layout: { type: flex, flex_flow: column, pad_row: 2 }
                                          widgets:
                                            - label: { text: "USE BY", text_font: f15b, text_letter_space: 1, text_color: 0x8C95A5 }
                                            - label: { id: lbl_useby, text: "" }
                                - label: { id: res_text, text: "", width: 100%, long_mode: WRAP, text_font: f18, text_color: 0xE7B9BF, hidden: true }
                                - obj: { flex_grow: 1, width: 1 }
                                - obj:
                                    id: count_row
                                    width: 100%
                                    height: SIZE_CONTENT
                                    layout: { type: flex, flex_flow: row, flex_align_cross: center, pad_column: 12 }
                                    widgets:
                                      - label: { id: lbl_prev, text: "", text_font: f44b, text_color: 0x5C6575 }
                                      - label: { id: lbl_arrow, text: "\U000F0054", text_font: i28, text_color: 0x5C6575 }
                                      - label: { id: lbl_count, text: "", text_font: f72b }
                                      - label: { id: lbl_left, text: "left", text_color: 0xA3ACBB }
                                      - obj: { flex_grow: 1, height: 1 }
                                      - label: { id: lbl_more, text: "Took\nmore?", text_font: f18, text_color: 0xA3ACBB, text_align: RIGHT }
                                      - button:
                                          id: btn_minus
                                          width: 60
                                          height: 60
                                          radius: 14
                                          bg_color: 0x262C37
                                          widgets:
                                            - label: { text: "−", align: CENTER, text_font: f30b }
                                          on_click:
                                            - script.execute: { id: adjust_last, by: -1 }
                                      - button:
                                          id: btn_plus
                                          width: 60
                                          height: 60
                                          radius: 14
                                          bg_color: 0x39404D
                                          widgets:
                                            - label: { text: "+", align: CENTER, text_font: f30b }
                                          on_click:
                                            - script.execute: { id: adjust_last, by: 1 }
                                - obj:
                                    id: empty_row
                                    width: 100%
                                    height: SIZE_CONTENT
                                    hidden: true
                                    layout: { type: flex, flex_flow: row, pad_column: 12 }
                                    widgets:
                                      - button:
                                          id: btn_fix
                                          flex_grow: 1
                                          height: 64
                                          radius: 14
                                          bg_color: 0xF1F3F7
                                          widgets:
                                            - label: { text: "It was there, fix count", align: CENTER, text_font: f22b, text_color: 0x0E1116 }
                                          on_click:
                                            - script.execute: fix_count
                                      - button:
                                          width: 140
                                          height: 64
                                          radius: 14
                                          bg_opa: TRANSP
                                          border_width: 2
                                          border_color: 0x5A2A32
                                          widgets:
                                            - label: { text: "Ignore", align: CENTER, text_font: f22b, text_color: 0xE7B9BF }
                                          on_click:
                                            - script.execute: show_idle
                          # Drains while the result is up, then the screen goes home.
                          - bar:
                              id: bar_return
                              floating: true
                              align: BOTTOM_MID
                              y: 12
                              width: 100%
                              height: 4
                              min_value: 0
                              max_value: 100
                              value: 0
                              radius: 2
                              bg_opa: TRANSP
                              anim_duration: 8s
                              indicator:
                                radius: 2
                                bg_color: 0x2FBF71
                                bg_opa: 60%

                    # A new barcode, while the server asks Open Food Facts
                    - obj:
                        id: lookup_card
                        width: 100%
                        flex_grow: 1
                        hidden: true
                        bg_opa: COVER
                        bg_color: 0x13233A
                        radius: 20
                        border_width: 3
                        border_color: 0x2B4A73
                        pad_left: 28
                        pad_right: 28
                        scrollable: false
                        layout: { type: flex, flex_flow: column, flex_align_main: center, pad_row: 12 }
                        widgets:
                          - spinner:
                              width: 64
                              height: 64
                              spin_time: 1s
                              arc_length: 90deg
                              arc_color: 0x223654
                              arc_width: 5
                              indicator:
                                arc_color: 0x6FB0FF
                                arc_width: 5
                          - label: { text: "Looking it up…", text_font: f36b }
                          - label: { id: lbl_lookup_code, text: "", text_font: f22b, text_letter_space: 2, text_color: 0xCFE0F7 }
                          - label:
                              text: "First time we've seen this barcode. Asking Open Food Facts for its name and photo. Keep scanning, it's already counted."
                              width: 100%
                              long_mode: WRAP
                              text_font: f18
                              text_color: 0xA9B8CC

                    # Not in the food database: QR opens it on the phone to name it
                    - obj:
                        id: unknown_card
                        width: 100%
                        flex_grow: 1
                        hidden: true
                        bg_opa: COVER
                        bg_color: 0x2A2112
                        radius: 20
                        border_width: 3
                        border_color: 0xF0A43A
                        pad_all: 20
                        scrollable: false
                        layout: { type: flex, flex_flow: row, flex_align_cross: center, pad_column: 20 }
                        widgets:
                          - obj:
                              flex_grow: 1
                              height: SIZE_CONTENT
                              layout: { type: flex, flex_flow: column, pad_row: 9 }
                              widgets:
                                - obj:
                                    width: SIZE_CONTENT
                                    height: SIZE_CONTENT
                                    text_color: 0xF0A43A
                                    layout: { type: flex, flex_flow: row, flex_align_cross: center, pad_column: 8 }
                                    widgets:
                                      - label: { text: "\U000F0625", text_font: i22 }
                                      - label: { text: "NEW BARCODE", text_font: f17b, text_letter_space: 1 }
                                - label: { id: lbl_unk_title, text: "Not in the food database", text_font: f30b, width: 100%, long_mode: WRAP }
                                - label: { id: lbl_unk_code, text: "", text_font: f22b, text_letter_space: 1, text_color: 0xE3C493 }
                                - label: { id: lbl_unk_text, text: "", text_font: f18, width: 100%, long_mode: WRAP, text_color: 0xD9C9AE }
                          - obj:
                              id: unk_qr
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              layout: { type: flex, flex_flow: column, flex_align_cross: center, pad_row: 8 }
                              widgets:
                                - obj:
                                    width: SIZE_CONTENT
                                    height: SIZE_CONTENT
                                    bg_opa: COVER
                                    bg_color: 0xFFFFFF
                                    radius: 12
                                    pad_all: 10
                                    widgets:
                                      - qrcode:
                                          id: qr_code
                                          size: 140
                                          dark_color: 0x0E1116
                                          light_color: 0xFFFFFF
                                          text: "pantry"
                                - label: { text: "Name it on your phone", text_font: f15, text_color: 0xD9C9AE }

                    # Server unreachable: scans wait on this unit
                    - obj:
                        id: offline_card
                        width: 100%
                        flex_grow: 1
                        hidden: true
                        bg_opa: COVER
                        bg_color: 0x2A1519
                        radius: 20
                        border_width: 3
                        border_color: 0xF05A6A
                        pad_left: 26
                        pad_right: 26
                        scrollable: false
                        layout: { type: flex, flex_flow: column, flex_align_main: center, pad_row: 12 }
                        widgets:
                          - label: { text: "\U000F05AA", text_font: i64, text_color: 0xF05A6A }
                          - label: { text: "Can't reach the pantry", text_font: f36b, width: 100%, long_mode: WRAP }
                          - label:
                              text: "Keep scanning. Scans are saved on this scanner and sent automatically when the server is back."
                              width: 100%
                              long_mode: WRAP
                              text_color: 0xE7B9BF
                          - label: { id: lbl_retry, text: "", text_font: f18, text_color: 0xC98F97 }

                    # UNDO: this scanner's recent scans, tap one to reverse it
                    - obj:
                        id: undo_card
                        width: 100%
                        flex_grow: 1
                        hidden: true
                        bg_opa: COVER
                        bg_color: 0x171B22
                        radius: 20
                        pad_all: 14
                        pad_left: 16
                        pad_right: 16
                        pad_bottom: 10
                        scrollable: false
                        layout: { type: flex, flex_flow: column, pad_row: 6 }
                        widgets:
                          - obj:
                              width: 100%
                              height: 22
                              pad_left: 6
                              pad_right: 6
                              widgets:
                                - label: { text: "UNDO A SCAN", text_font: f15b, text_letter_space: 1, text_color: 0x8C95A5 }
                                - label: { align: TOP_RIGHT, text: "Tap the one to reverse", text_font: f15, text_color: 0x8C95A5 }
                          - button:
                              id: urow0
                              width: 100%
                              height: 48
