# Pantry wall scanner on its own mainboard (hardware/mainboard): ESP32-S3-WROOM-1
# N16R8 behind a bare 4.3" 800x480 RGB panel with GT911 touch, plus scanner,
# buzzer, side-view status LED and presence radar on the same board.
#
# Differences from the Sunton build (pantry-scanner.yaml):
#   - USB-C is the ESP32-S3's native USB: flashing and logs go there, so the
#     scanner has UART0 (GPIO43/44) to itself. No unplugging to flash.
#   - the display's RGB signals sit on GPIOs in the ribbon connector's order
#     (that's what lets the board route without a tangle), so the pins below
#     differ from the Sunton's; the timing is the same panel's
#   - touch on IO39 (SDA) / IO40 (SCL) / IO41 (INT) / IO42 (RST)
#   - backlight IO5, buzzer IO2, SK6812 status LED IO1, radar OUT IO4
#
# Scanner: SparkFun 2D Barcode Scanner (DE2120) on J4, or any 5 V UART module
# (GM65, GM805, GM861) on J5. Set it to 9600 baud with a CR suffix.

substitutions:
  name: pantry-scanner
  server: http://192.168.10.10:5190   # pantry app, reachable from this VLAN
  location: Pantry                     # where this unit hangs; used for products with no usual place yet
  scanner_baud: "9600"                 # GM65 default; set the SparkFun DE2120 to 9600 too, or change this

esphome:
  name: ${name}
  friendly_name: Pantry scanner

# The screens (shared with pantry-sim.yaml) and the buzzer / LED / radar.
packages:
  feedback: !include
    file: pantry-feedback.yaml
    vars: { buzzer_pin: GPIO2, led_pin: GPIO1, led_chipset: SK6812, presence_pin: GPIO4 }
  ui: !include pantry-ui.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# Logs on the native USB port; UART0 belongs to the scanner.
logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

# OTA uses the API encryption key.
ota:
  - platform: esphome

# The clock comes from Home Assistant, so the IoT VLAN needs no internet.
time:
  - platform: homeassistant
    id: ha_time

# ── hardware ────────────────────────────────────────────────────────────

uart:
  - id: scanner_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: ${scanner_baud}
    debug:
      direction: RX
      dummy_receiver: true
      after:
        delimiter: "\r"
        timeout: 100ms   # also works if the CR suffix isn't enabled
      sequence:
        - lambda: |-
            std::string code;
            for (auto b : bytes) if (b > 32 && b < 127) code += (char) b;
            if (!code.empty()) id(handle_scan)->execute(code);

output:
  - platform: ledc
    pin: GPIO5
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms

i2c:
  sda: GPIO39
  scl: GPIO40

touchscreen:
  - platform: gt911
    id: touch
    display: main_display
    interrupt_pin: GPIO41
    reset_pin: GPIO42
    on_touch:
      - script.execute: wake

display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO38
    hsync_pin: GPIO48
    vsync_pin: GPIO45
    pclk_pin: GPIO47
    pclk_frequency: 16MHz
    pclk_inverted: true
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red: [GPIO6, GPIO7, GPIO15, GPIO16, GPIO17]           # panel R3..R7
      green: [GPIO18, GPIO8, GPIO3, GPIO46, GPIO9, GPIO10]  # panel G2..G7
      blue: [GPIO11, GPIO12, GPIO13, GPIO14, GPIO21]        # panel B3..B7
