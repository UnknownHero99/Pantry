services:
  pantry:
    # GitHub Actions publishes this on every push to master; `--build` builds it from this checkout instead.
    image: ${PANTRY_IMAGE:-ghcr.io/unknownhero99/pantry:latest}
    build: .
    container_name: pantry
    restart: unless-stopped
    ports:
      - "5190:5190"
    volumes:
      - ./data:/data
    environment:
      # Times in History are shown in this zone.
      TZ: ${TZ:-Europe/Ljubljana}
      # Public HTTPS URL the reverse proxy serves this on (form posts check it).
      ORIGIN: ${ORIGIN:-}
      # Optional: mirror the shopping list into a Home Assistant to-do list.
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_TODO_ENTITY: ${HA_TODO_ENTITY:-}
      # Optional: the garage list into its own to-do list, and lending reminders.
      HA_TODO_ENTITY_GARAGE: ${HA_TODO_ENTITY_GARAGE:-}
      HA_NOTIFY: ${HA_NOTIFY:-}
      # Optional: your reverse proxy's address(es). Only these may set X-Forwarded-*;
      # unset, any private/loopback address is trusted.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
